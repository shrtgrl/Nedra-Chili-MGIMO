:root{

  --text:#0E0E0E; --muted:#5E544B; --accent:#EFF0A3; --on-accent:#0E0E0E; --mark:#F4B860;
  --act-bg:#0E0E0E; --act-fg:#FFFFFF; --link:#0E0E0E;
  --hero1:#EFF0A3; --hero2:#E6E88C; --chip:#F3F4C4; --skel:rgba(55,80,120,.13);
  --warn:#F4B860; --danger:#F08C7C; --ok:#BFE3C9; --err-bg:#FBE3DE; --err:#A3341F; --info-bg:rgba(55,80,120,.12);
  --shadow:0 1px 2px rgba(14,14,14,.08),0 12px 32px -14px rgba(14,14,14,.3);
  --glass-bg:linear-gradient(135deg,rgba(255,255,240,.96) 0%,rgba(255,255,240,.66) 46%,rgba(255,255,240,.9) 100%),rgba(255,255,240,.5);
  --glass-shadow:inset 1.5px 1.5px 1px -1px rgba(255,255,255,1),inset -1.5px -1.5px 1px -1px rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.5),0 1px 2px rgba(40,60,100,.08),0 14px 34px -12px rgba(40,64,110,.30);
  --glass-filter:blur(20px) saturate(190%) brightness(1.05); --dlg:rgba(255,255,240,.92);
  --knob:#FFFFFF; --tog-off:#C4CCDA; --focus:#0E0E0E;
  --font:'Open Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
[data-theme=dark]{
  --bg:#212121; --surface:#2B2B2F; --surface2:rgba(255,255,255,.085); --line:#404147; --field-line:#9A9186;
  --text:#F6F5FA; --muted:#BDB3A8; --accent:#EFF0A3; --on-accent:#0E0E0E; --mark:#F4B860;
  --act-bg:#EFF0A3; --act-fg:#0E0E0E; --link:#EFF0A3;
  --chip:#44462C; --skel:rgba(255,255,255,.14); --ok:#8FC9A0; --err-bg:#3A2522; --err:#F08C7C; --info-bg:rgba(255,255,255,.13);

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.no-tr *{transition:none!important}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0;text-wrap:pretty}
a{color:var(--link);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}

  const flt={all:()=>true,work:r=>r.step<2,done:r=>r.step>=2}[S.ui.filter];
  const list=S.reqs.filter(flt);
  const cards=list.map(r=>`<article class="req"><div class="row between" style="flex-wrap:nowrap"><div><b>${esc(r.type)}</b><div class="muted" style="font-size:.9375rem">${esc(r.goal)} · ${esc(r.date)}</div></div>${pill(STEPS[r.step],r.step>=2?"ok":"info")}</div>${stepper(r.step)}<div class="row" style="margin-top:14px"><button class="btn ghost sm" data-dl="${r.id}" ${r.step<2?"disabled":""}>${ic("doc",20,2)}Скачать</button>${r.step<3?`<button class="btn danger sm" data-cancel="${r.id}">Отменить заявку</button>`:""}</div></article>`).join("");
  return `<div class="grid2"><section class="card"><h2>Новая заявка</h2><form id="reqForm" novalidate><div class="tiles" role="group" aria-label="Тип заявки">${REQ_TYPES.map((t,i)=>`<button type="button" class="tile" data-type="${i}" aria-pressed="${S.ui.reqType===i}">${t}</button>`).join("")}</div>
<div class="stack" style="margin-top:20px">${field("goal","Цель",{ph:"Например, для предоставления по месту требования",val:(S.ui.draft&&S.ui.draft.goal)||"",err:e.goal})}
<div class="field"><label for="comment">Комментарий</label><textarea class="ta" id="comment" placeholder="Дополнительные сведения">${esc((S.ui.draft&&S.ui.draft.comment)||"")}</textarea></div>
<div class="field"><label for="delivery">Способ получения</label><select class="sel" id="delivery">${["Электронно (PDF)","В деканате"].map(o=>`<option ${(S.ui.draft&&S.ui.draft.delivery)===o?"selected":""}>${o}</option>`).join("")}</select></div>
<div class="row between"><span class="muted">Срок исполнения: до 3 рабочих дней</span><button class="btn" type="submit">${ic("check",20,2.5)}Отправить заявку</button></div></div></form></section>
<section class="card"><h2>Мои заявки</h2><div class="chips" role="group" aria-label="Фильтр" style="margin-bottom:16px">${[["all","Все"],["work","В работе"],["done","Готовы"]].map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${S.ui.filter===k}">${t}</button>`).join("")}</div><div class="stack">${cards||emptyBox("Заявок пока нет","Здесь появятся ваши справки и заявления")}</div></section></div>`;
}
const NIC={deadline:"alert",news:"bell",change:"calendar",request:"doc"};
function sNotifs(){
  const items=S.notifs.map(n=>`<div class="notif ${n.read?"":"unread"}"><div class="ic">${ic(NIC[n.kind],22)}</div><div style="flex:1;min-width:0"><b>${esc(n.title)}</b><p class="muted">${esc(n.text)}</p><div class="muted" style="font-size:.875rem">${esc(n.time)}</div></div>${n.read?"":`<button class="btn soft sm" data-read="${n.id}">Прочитано</button>`}</div>`).join("");
  return `<section class="card" style="max-width:860px"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">Все уведомления</h2><button class="btn soft sm" id="readAll" ${unread()?"":"disabled"}>Прочитать все</button></div>${items||emptyBox("Нет уведомлений","Новые события появятся здесь")}</section>`;
}
function switchRow(k,l){const on=S.prefs[k];const id="sw_"+k;return `<div class="switch"><span id="${id}">${l}</span><button type="button" role="switch" aria-checked="${on}" aria-labelledby="${id}" data-pref="${k}"><span class="trk"><i></i></span></button></div>`}
function profile(){
  const u=me();
  return `<div class="grid2"><section class="card"><div class="row" style="gap:18px;margin-bottom:20px"><span class="av" style="width:72px;height:72px;font-size:1.5rem">${esc(u.short)}</span><div><h2 style="margin:0;font-size:1.5rem">${esc(u.name)}</h2><div class="muted">${esc(u.role==="student"?"Группа "+u.group:u.group)}</div></div></div>
<dl style="margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 22px;overflow-wrap:anywhere"><dt class="muted">Подразделение</dt><dd style="margin:0">${esc(u.faculty)}</dd><dt class="muted">Почта</dt><dd style="margin:0">${esc(u.email)}</dd><dt class="muted">Роль</dt><dd style="margin:0">${u.role==="student"?"Студент":"Преподаватель"}</dd></dl></section>
<section class="card"><h2>Настройки</h2>${switchRow("deadlines","Уведомления о дедлайнах")}${switchRow("schedule","Изменения в расписании")}${switchRow("news","Новости деканата")}
<div class="row" style="margin-top:20px"><button class="btn soft" id="themeBtn2">${ic(S.theme==="dark"?"sun":"moon",20,2)}${S.theme==="dark"?"Светлая тема":"Тёмная тема"}</button><button class="btn soft" id="logout">${ic("out",20,2)}Выйти</button></div></section></div>`;
}
/* ====================== teacher pages ====================== */
function tHome(){
  const d=today(),list=TSCHED[d]||[],nx=nextLesson(list),nn=S.inq.filter(i=>i.status==="new").length;
  return `<div class="grid2"><div class="col"><section class="hero"><div><div class="eyebrow">Следующее занятие</div>${nx?`<div class="big tnum">${nx.s}</div><h2 style="font-size:1.5rem;margin-top:4px">${esc(nx.n)}</h2><div class="muted">${esc(nx.w)} · ${esc(nx.r)}</div>`:`<h2 style="font-size:1.5rem;margin-top:8px">Сегодня занятий нет</h2>`}</div>${nx?pill(nx.k,"blue"):""}</section>
<div class="row"><a class="btn" href="#/gradebook">${ic("table",20,2.5)}Выставить оценки</a><a class="btn ghost" href="#/schedule">${ic("calendar",20,2.5)}Расписание</a></div>
<section class="card"><h2>Сегодня · ${esc(dstr())}</h2><div class="stack">${list.length?list.map(lesson).join(""):emptyBox("Занятий нет","Сегодня свободный день")}</div></section></div>
<div class="col"><section class="card"><h2>Обращения студентов</h2><p style="font-size:2.5rem;font-weight:700" class="tnum">${nn}</p><p class="muted" style="margin-bottom:14px">${nn?"ждут ответа":"новых обращений нет"}</p><a class="btn soft" href="#/inquiries">${ic("inbox",20,2)}Открыть обращения</a></section>
<section class="card"><h2>Ведомости</h2><p class="muted">Открыты для заполнения: «Макроэкономика», группа ИМО-21 — до 20 ноября.</p></section></div></div>`;
}
const GROUPS=[["Макроэкономика","ИМО-21","Экзамен"],["Макроэкономика","ИМО-22","Экзамен"],["Экономика данных","ИМО-31","Зачёт"]];
function tGradebook(){
  const g=GROUPS[S.ui.grp],key=g[0]+"|"+g[1],pts=S.pts[key]||{};
  const rows=STUDENTS.map((n,i)=>{const v=pts[i];const has=v!==undefined&&v!=="";return `<tr><td class="tnum">${i+1}</td><td>${esc(n)}</td><td><label class="vh" for="p${i}">Баллы: ${esc(n)}</label><input class="in gin tnum" id="p${i}" data-pi="${i}" type="number" min="0" max="100" inputmode="numeric" value="${has?v:""}" placeholder="0–100"></td><td style="text-align:right" id="gr${i}">${has?pill(grade(+v,g[2]),+v<50?"danger":"ok"):'<span class="muted">—</span>'}</td></tr>`}).join("");
  const filled=STUDENTS.filter((_,i)=>pts[i]!==undefined&&pts[i]!=="").length;
  return `<div class="row" style="align-items:flex-end;margin-bottom:22px"><div class="field" style="width:min(340px,100%)"><label for="grp">Дисциплина и группа</label><select class="sel" id="grp">${GROUPS.map((x,i)=>`<option value="${i}" ${i===S.ui.grp?"selected":""}>${x[0]} · ${x[1]}</option>`).join("")}</select></div><span class="muted" id="filled" style="margin-left:auto">Заполнено ${filled} из ${STUDENTS.length}</span><button class="btn" id="saveG">${ic("check",20,2.5)}Сохранить</button></div>
<section class="card"><div class="scroll"><table class="table"><thead><tr><th style="width:52px">№</th><th>Студент</th><th style="width:130px">Баллы</th><th style="text-align:right">Оценка (${g[2]})</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
const ST={new:["Новое","warn"],work:["В работе","info"],done:["Закрыто","ok"]};
function tInq(){
  const sel=S.inq.find(i=>i.id===S.ui.inqSel)||S.inq[0];
  const list=S.inq.map(i=>`<button class="inq" data-inq="${i.id}" aria-pressed="${i.id===sel.id}"><div class="row between" style="flex-wrap:nowrap"><b>${esc(i.from)}</b>${pill(ST[i.status][0],ST[i.status][1])}</div><div>${esc(i.subject)}</div><div class="muted" style="font-size:.875rem">Группа ${esc(i.group)}</div></button>`).join("");
  return `<div class="split"><section class="card"><h2>Входящие</h2><div class="stack" style="gap:10px">${list}</div></section>
<section class="card"><div class="row between" style="margin-bottom:14px;flex-wrap:nowrap"><div><h2 style="margin:0">${esc(sel.subject)}</h2><div class="muted">${esc(sel.from)} · группа ${esc(sel.group)}</div></div>${pill(ST[sel.status][0],ST[sel.status][1])}</div>
<div class="req" style="margin-bottom:18px"><p>${esc(sel.text)}</p></div>
${sel.reply?`<div class="req" style="margin-bottom:18px;border-left:4px solid var(--act-bg)"><b>Ваш ответ</b><p>${esc(sel.reply)}</p></div>`:""}
<form id="replyForm" class="stack" data-id="${sel.id}"><div class="field"><label for="status">Статус</label><select class="sel" id="status"><option value="work" ${sel.status==="work"?"selected":""}>В работе</option><option value="done" ${sel.status==="done"?"selected":""}>Закрыто</option></select></div>
<div class="field"><label for="reply">Ответ студенту</label><textarea class="ta" id="reply" placeholder="Напишите ответ"></textarea></div><div class="row" style="justify-content:flex-end"><button class="btn" type="submit">${ic("check",20,2.5)}Отправить ответ</button></div></form></section></div>`;
}
/* ====================== router & events ====================== */
function pageFor(p){
  const role=me().role;
  if(role==="student")return {home:sHome,schedule:()=>schedView(SCHED),grades:sGrades,requests:sRequests,notifications:sNotifs,profile:profile}[p];
  return {home:tHome,schedule:()=>schedView(TSCHED),gradebook:tGradebook,inquiries:tInq,profile:profile}[p];
}
function render(focus){
  const app=document.getElementById("app");
  if(!me()){document.title="Вход — Онлайн деканат МУКПиД";delete app.dataset.shell;app.innerHTML=loginView();return}
  let p=(location.hash.replace(/^#\//,"")||"home");
  if(p!=="profile"&&!NAV[me().role].some(n=>n[0]===p)){p="home"}
  const fn=pageFor(p);
  document.title=TITLES[p]+" — Онлайн деканат МУКПиД";
  const html=shell(p,fn());
  const side=app.querySelector(".side");
  if(side&&app.dataset.shell===S.user){
    /* keep the sidebar element alive so its hover/expand state and animation are not restarted */
    const tpl=document.createElement("template");tpl.innerHTML=html;
    const nl=tpl.content.querySelectorAll(".nav a"),cl=side.querySelectorAll(".nav a");
    const nm=tpl.content.querySelector(".me"),cm=side.querySelector(".me");if(nm.hasAttribute("aria-current"))cm.setAttribute("aria-current","page");else cm.removeAttribute("aria-current");
    cl.forEach((a,i)=>{const n=nl[i];if(!n)return;a.innerHTML=n.innerHTML;if(n.hasAttribute("aria-current"))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
    app.querySelector("main").replaceWith(tpl.content.querySelector("main"));
    app.querySelector(".tabbar").replaceWith(tpl.content.querySelector(".tabbar"));
  }else{app.innerHTML=html;app.dataset.shell=S.user}
  if(focus){const h=document.getElementById("h1");h&&h.focus({preventScroll:true});window.scrollTo(0,0)}
}
window.addEventListener("hashchange",()=>{S.ui.err=null;render(true)});
function setTheme(t){S.theme=t;save("theme");applyTheme(t);render(false)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.id==="themeBtn"||t.id==="themeBtn2"){setTheme(S.theme==="dark"?"light":"dark");return}
  if(t.id==="logout"){S.user=null;save("user");location.hash="#/";render(true);return}
  if(t.dataset.fill){document.getElementById("login").value=t.dataset.fill;document.getElementById("pass").value="demo123";document.getElementById("pass").focus();return}
  if(t.id==="forgot"){e.preventDefault();toast("Демо: восстановление пароля не подключено");return}
  if(t.dataset.view){S.ui.view=t.dataset.view;render(false);return}
  if(t.dataset.day){S.ui.day=+t.dataset.day;render(false);return}
  if(t.dataset.type||t.dataset.f){
    const g=id=>{const x=document.getElementById(id);return x?x.value:""};
    S.ui.draft={goal:g("goal"),comment:g("comment"),delivery:g("delivery")};
    if(t.dataset.type)S.ui.reqType=+t.dataset.type;else S.ui.filter=t.dataset.f;
    render(false);return}
  if(t.dataset.dl){toast("Демо: файл справки не создаётся");return}
  if(t.dataset.cancel){const id=+t.dataset.cancel;confirmDlg({title:"Отменить заявку?",text:"Заявка будет закрыта, вернуть её нельзя. Чтобы получить справку, создайте новую заявку.",ok:"Отменить заявку"},()=>{S.reqs=S.reqs.filter(r=>r.id!==id);save("reqs");render(false);toast("Заявка отменена")});return}
  if(t.dataset.read){const n=S.notifs.find(x=>x.id==t.dataset.read);if(n){n.read=true;save("notifs");render(false)}return}
  if(t.id==="readAll"){S.notifs.forEach(n=>n.read=true);save("notifs");render(false);return}
  if(t.dataset.pref){const k=t.dataset.pref;S.prefs[k]=!S.prefs[k];save("prefs");t.setAttribute("aria-checked",S.prefs[k]);return}
  if(t.dataset.inq){S.ui.inqSel=+t.dataset.inq;render(false);return}
  if(t.id==="saveG"){const g=GROUPS[S.ui.grp];save("pts");toast("Ведомость сохранена: "+g[0]+", "+g[1]);return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.pi!==undefined){
    const g=GROUPS[S.ui.grp],key=g[0]+"|"+g[1];S.pts[key]=S.pts[key]||{};
    let v=t.value;if(v!==""){v=Math.max(0,Math.min(100,Math.round(+v)))}
    S.pts[key][t.dataset.pi]=v;
    const cell=document.getElementById("gr"+t.dataset.pi);
    cell.innerHTML=v===""?'<span class="muted">—</span>':pill(grade(+v,g[2]),+v<50?"danger":"ok");
    document.getElementById("filled").textContent="Заполнено "+STUDENTS.filter((_,i)=>S.pts[key][i]!==undefined&&S.pts[key][i]!=="").length+" из "+STUDENTS.length;
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="grp"){S.ui.grp=+e.target.value;render(false)}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="loginForm"){
    const l=f.login.value.trim().toLowerCase(),p=f.pass.value,err={login:f.login.value};
    if(!l)err.l="Введите логин, чтобы войти";
    if(!p)err.p="Введите пароль";
    if(!err.l&&!err.p){const u=USERS[l];if(!u||u.pass!==p)err.g="Неверный логин или пароль. Используйте тестовый аккаунт ниже."}
    if(err.l||err.p||err.g){S.ui.err=err;render(false);const first=document.querySelector("[aria-invalid=true]")||document.getElementById("login");first.focus();return}
    S.user=l;save("user");S.ui.err=null;S.ui.day=null;location.hash="#/home";render(true);return;
  }
  if(f.id==="reqForm"){
    const goal=f.goal.value.trim();
    if(!goal){S.ui.draft={goal:"",comment:f.comment.value,delivery:f.delivery.value};S.ui.err={goal:"Укажите цель заявки"};render(false);document.getElementById("goal").focus();return}
    S.reqs.unshift({id:Date.now(),type:REQ_TYPES[S.ui.reqType],goal,comment:f.comment.value,delivery:f.delivery.value,step:0,date:new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"})});
    save("reqs");S.ui.err=null;S.ui.draft=null;S.ui.filter="all";render(false);toast("Заявка отправлена. Статус можно отслеживать справа");return;
  }
  if(f.id==="replyForm"){
    const id=+f.dataset.id,i=S.inq.find(x=>x.id===id),txt=f.reply.value.trim();
    i.status=f.status.value;if(txt)i.reply=txt;save("inq");render(false);toast(txt?"Ответ отправлен":"Статус обновлён");
  }
});
document.getElementById("dlg").addEventListener("cancel",()=>{});
render(true);
</script>
</body>
</html>
