<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="МУКПиД · Онлайн деканат — концепт для конкурса «Вайб-кодинг»" />
    <script>
      // Применяем тему до загрузки React, чтобы не было вспышки
      try {
        var t = JSON.parse(localStorage.getItem('mukpid:theme') || 'null') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        var v = JSON.parse(localStorage.getItem('mukpid:variant') || 'null') || 'fog'
        document.documentElement.dataset.theme = t
        document.documentElement.dataset.variant = v
      } catch (e) {}
    </script>
    <title>МУКПиД · Онлайн деканат</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
